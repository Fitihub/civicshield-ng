[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # A strict script-src (no 'unsafe-inline') also has the side effect of
    # blocking Netlify's own "Powered by Netlify" badge and pre-launch
    # toolbar, which render via an inline frame injected at the edge.
    # The primary control for that badge is still the dashboard toggle at
    # Project configuration > General > Powered by Netlify badge — this
    # header is a belt-and-suspenders backup, not a replacement for it.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
